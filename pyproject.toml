[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfid"
version = "1.0.0"
description = "PDFiD: a PDF triage scanner that looks for suspicious keywords (JavaScript, OpenAction, ...)"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Didier Stevens" },
    { name = "Raphaël Vinot" },
]
keywords = ["pdf", "security", "malware", "forensics", "triage"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: Public Domain",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/Rafiot/pdfid"
Original = "https://blog.didierstevens.com/programs/pdf-tools/"

[project.scripts]
pdfid = "pdfid.cli:main"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["pdfid*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
